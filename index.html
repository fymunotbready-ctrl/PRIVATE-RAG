<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Document AI</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mut:#8a90a0;--ac:#4f8cff;--bd:#272b36}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--tx:#14161a;--mut:#667;--bd:#e0e3ea}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:900px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h1{font-size:18px;margin:0}h2{font-size:14px;color:var(--mut);margin:0 0 8px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row input{flex:1}
.doc{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.doc button{background:none;color:#e55;padding:0 6px}
.msg{margin:10px 0;white-space:pre-wrap}.q{color:var(--ac);font-weight:600}
.src{font-size:12px;color:var(--mut)}
</style></head><body><div class="wrap">
<div class="card" id="login"><h1>Private Document AI</h1><br>
<div class="row"><input id="key" type="password" placeholder="Access key"><button onclick="login()">Enter</button></div></div>
<div id="app" hidden>
<div class="card"><h2>Documents (PDF, TXT, MD)</h2>
<input type="file" id="files" multiple accept=".pdf,.txt,.md">
<button id="up" onclick="upload()">Upload &amp; index</button>
<div id="docs"></div><div class="src" id="status"></div></div>
<div class="card"><h2>Ask your documents</h2><div id="chat"></div>
<div class="row"><input id="q" placeholder="e.g. What is the notice period?" onkeydown="if(event.key==='Enter')ask()">
<button id="go" onclick="ask()">Ask</button></div></div>
</div></div>
<script>
let K=sessionStorage.getItem('k')||'';
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'x-key':K};
  const r=await fetch(path,opt);
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||r.statusText)}
  return r.json();
}
async function login(){K=$('key').value;try{await loadDocs();sessionStorage.setItem('k',K);
  $('login').hidden=true;$('app').hidden=false}catch(e){alert(e.message)}}
async function loadDocs(){
  const d=await api('/api/docs');
  $('docs').innerHTML=d.map(n=>`<div class="doc"><span>${esc(n)}</span><button onclick="del(this.dataset.n)" data-n="${esc(n)}">remove</button></div>`).join('')||'<div class="src">No documents yet.</div>';
}
async function upload(){
  const f=$('files').files;if(!f.length)return;
  const fd=new FormData();for(const x of f)fd.append('files',x);
  $('up').disabled=true;$('status').textContent='Indexing… large files take a minute.';
  try{const r=await api('/api/upload',{method:'POST',body:fd});$('status').textContent=`Indexed ${r.chunks} passages.`;$('files').value='';await loadDocs()}
  catch(e){$('status').textContent=e.message}$('up').disabled=false;
}
async function del(n){if(!confirm('Remove '+n+'?'))return;await api('/api/docs/'+encodeURIComponent(n),{method:'DELETE'});loadDocs()}
async function ask(){
  const q=$('q').value.trim();if(!q)return;$('q').value='';$('go').disabled=true;
  const m=document.createElement('div');m.className='msg';m.innerHTML=`<div class="q">${esc(q)}</div><div>Thinking…</div>`;
  $('chat').appendChild(m);
  try{const r=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
    m.innerHTML=`<div class="q">${esc(q)}</div><div>${esc(r.answer)}</div><div class="src">${r.sources.map((s,i)=>`[${i+1}] ${esc(s.file)} ${esc(s.loc)}`).join(' · ')}</div>`}
  catch(e){m.lastChild.textContent='Error: '+e.message}$('go').disabled=false;
}
if(K){$('key').value=K;login()}
</script></body></html>
